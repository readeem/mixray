[settings]
lockfile = true

[tool_config]
locked = true

[tools]
go = "1.27.4"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"

[env]
# Match release builds: gVisor for TUN without redirect, and no EasyTier (which JITs).
GOFLAGS = "-tags=with_gvisor,no_easytier"

[tasks.sync]
description = "3-way merge a newer upstream mihomo release into the working tree"
run = "./scripts/sync-upstream.sh"

[tasks.diff-upstream]
description = "Show local changes against the pinned upstream mihomo release"
run = "./scripts/diff-upstream.sh"

[tasks.check]
description = "Vet, cross-compile check, and run tests"
run = "./scripts/check.sh"

[tasks.vulncheck]
description = "Scan the release binary and pinned upstreams for vulnerabilities"
run = "./scripts/check-vulnerabilities.sh"

[tasks.build]
description = "Build cross-platform release archives into dist/"
run = "./scripts/build-release.sh"
