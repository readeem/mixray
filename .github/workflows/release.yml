name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (e.g. 0.1.0 or v0.1.0)
        required: true
        type: string
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ $EVENT_NAME == workflow_dispatch ]]; then
            [[ $REF_NAME == main ]] || { echo "workflow_dispatch releases must run from main" >&2; exit 1; }
            tag="v${INPUT_VERSION#v}"
          else
            tag="$REF_NAME"
          fi
          [[ $tag =~ ^v(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})$ ]] || {
            echo "invalid version tag: $tag (expected vX.Y.Z)" >&2
            exit 1
          }
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

  checks:
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [version, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          cache: false
      - name: build cross-platform archives
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: ./scripts/build-release.sh "$TAG"
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          # Draft first so a failed upload never exposes an incomplete release.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --draft --title "$TAG" --generate-notes
          fi
          if [[ $(gh release view "$TAG" --json isDraft --jq .isDraft) == true ]]; then
            gh release upload "$TAG" mixray-* SHA256SUMS --clobber
            gh release edit "$TAG" --draft=false
          else
            echo "release $TAG is already published; refusing to overwrite" >&2
            exit 1
          fi
